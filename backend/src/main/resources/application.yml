server:
  port: 8080

spring:
  jackson:
    default-property-inclusion: always
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/citibike?serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      connection-init-sql: "SET time_zone = '+00:00'"
      connection-timeout: 10000
      data-source-properties:
        socketTimeout: 10000
  jdbc:
    template:
      query-timeout: 10s

citibike:
  api:
    historical-data-origin: HISTORICAL
    replay-clock-mode: wall
    live-ttl-seconds: 180
