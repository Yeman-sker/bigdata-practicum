name: Citi Bike source verifier

on:
  pull_request:
    paths:
      - ".github/workflows/citibike-source.yml"
      - "scripts/citibike/**"
      - "tests/**"
      - "docs/source/**"
      - "fixtures/citibike/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/citibike-source.yml"
      - "scripts/citibike/**"
      - "tests/**"
      - "docs/source/**"
      - "fixtures/citibike/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run verifier self-check
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Compile verifier
        run: python -m py_compile scripts/citibike/verify_source.py
