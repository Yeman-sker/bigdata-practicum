name: CI - Quality & Contract Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Code Quality & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Syntax Compilation Check
        run: |
          python -m compileall -q .

      - name: Run Ruff Linter
        run: |
          ruff check --select E,F,W --ignore E501 .

  test-and-validate:
    name: Contract & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Unit Tests & Contract Validators
        run: |
          python -m pip install -r requirements-contracts.txt
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Compile and Run Java Operations Self-Checks
        run: |
          rm -rf /tmp/operations-classes
          mkdir -p /tmp/operations-classes
          javac --release 17 -Xlint:all -d /tmp/operations-classes \
            $(find backend/src/main/java backend/src/test/java -name '*.java' -print)
          java -ea -cp /tmp/operations-classes citibike.operations.OperationsSelfTest
          java -ea -cp /tmp/operations-classes citibike.operations.FixtureDrivenSelfTest fixtures/day2/cases.json
