name: CI - Quality & Contract Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Code Quality & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Syntax Compilation Check
        run: |
          python -m compileall -q .

      - name: Run Ruff Linter
        run: |
          ruff check --select E,F,W --ignore E501 .

  test-and-validate:
    name: Contract & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Unit Tests & Contract Validators
        run: |
          python -m pip install -r requirements-contracts.txt
          python -m unittest discover -s tests -p 'test_*.py' -v

  backend:
    name: Java Backend
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: citibike_fixture_it
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Load MySQL fixture
        env:
          MYSQL_PWD: root
        run: |
          mysql --protocol=tcp --host=127.0.0.1 --port=3306 --user=root citibike_fixture_it < sql/serving.sql
          mysql --protocol=tcp --host=127.0.0.1 --port=3306 --user=root citibike_fixture_it < fixtures/day2/seed.sql

      - name: Run Maven tests
        env:
          CITIBIKE_MYSQL_IT: "true"
          CITIBIKE_MYSQL_IT_URL: jdbc:mysql://127.0.0.1:3306/citibike_fixture_it?serverTimezone=UTC
          CITIBIKE_MYSQL_IT_USERNAME: root
          CITIBIKE_MYSQL_IT_PASSWORD: root
        run: mvn -f backend/pom.xml --batch-mode test
