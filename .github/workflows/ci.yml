name: CI - Quality & Contract Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Code Quality & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Syntax Compilation Check
        run: |
          python -m compileall -q .

      - name: Run Ruff Linter
        run: |
          ruff check .

  test-and-validate:
    name: Contract & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Unit Tests & Contract Validators
        run: |
          TEST_FILES=$(find . -name 'test_*.py' -not -path '*/.*')
          if [ -n "$TEST_FILES" ]; then
            echo "Discovered test files:"
            echo "$TEST_FILES"
            python -m unittest discover -s . -p 'test_*.py' -v
          else
            echo "No test_*.py discovered on current branch. Passing gate."
          fi
