<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eef8f5"/></linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d5c8f"/><stop offset="1" stop-color="#1e9b86"/></linearGradient>
    <style>
      .t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#173047}.muted{fill:#66778d}.card{fill:#fff;stroke:#dbe8ef;stroke-width:1.5}.blue{fill:#2c7be5}.green{fill:#169b7a}.orange{fill:#f59e42}.red{fill:#e95f52}.cyan{fill:#48a9dc}
      .h1{font-size:34px;font-weight:700}.h2{font-size:21px;font-weight:700}.h3{font-size:17px;font-weight:700}.p{font-size:15px}.small{font-size:13px}
    </style>
  </defs>
  <rect width="1400" height="920" fill="url(#bg)"/>
  <text x="55" y="58" class="t h1">候选方向 #2 · 历史天气坐标</text>
  <text x="55" y="88" class="t p muted">不是天气预报，而是告诉你：今天在几十年的历史里，到底有多反常 · 以下数字均为产品示意</text>

  <rect x="45" y="115" rx="22" width="1310" height="140" fill="url(#hero)"/>
  <text x="80" y="160" class="t h2" style="fill:#fff">选择城市和日期</text>
  <rect x="80" y="180" rx="14" width="370" height="46" fill="#fff" opacity="0.97"/>
  <text x="105" y="209" class="t p muted">南昌</text>
  <rect x="470" y="180" rx="14" width="300" height="46" fill="#fff" opacity="0.97"/>
  <text x="495" y="209" class="t p muted">2026-09-10</text>
  <rect x="790" y="180" rx="14" width="150" height="46" fill="#57bfa9"/>
  <text x="838" y="209" class="t p" style="fill:#fff;font-weight:700">查看历史</text>
  <text x="1010" y="170" class="t small" style="fill:#daf7ef">今天 38℃ 不重要，</text>
  <text x="1010" y="195" class="t small" style="fill:#daf7ef">重要的是它在历史上处于什么位置。</text>

  <!-- row 1 -->
  <rect x="45" y="280" rx="18" width="400" height="250" class="card"/>
  <text x="70" y="318" class="t h2">① 今天到底有多反常？</text>
  <text x="70" y="343" class="t small muted">把当天气温放回几十年的同期分布里</text>
  <text x="72" y="390" class="t h1 red">38.0℃</text>
  <text x="245" y="389" class="t h3">历史百分位 98%</text>
  <line x1="80" y1="445" x2="405" y2="445" stroke="#b8c8d5" stroke-width="8" stroke-linecap="round"/>
  <line x1="80" y1="445" x2="382" y2="445" stroke="#e95f52" stroke-width="8" stroke-linecap="round"/>
  <circle cx="382" cy="445" r="11" class="red"/>
  <text x="78" y="474" class="t small muted">偏冷</text><text x="355" y="474" class="t small muted">极端偏热</text>
  <text x="72" y="507" class="t small red">🔥 明显偏热，但尚未突破历史同期极值</text>

  <rect x="470" y="280" rx="18" width="430" height="250" class="card"/>
  <text x="495" y="318" class="t h2">② 天气穿越</text>
  <text x="495" y="343" class="t small muted">看看 10 年前、20 年前、出生那年的今天</text>
  <text x="525" y="390" class="t h3 blue">2006-09-10</text><text x="745" y="390" class="t h3 red">2026-09-10</text>
  <text x="500" y="430" class="t small muted">最高温</text><text x="600" y="430" class="t p">30℃</text><text x="695" y="430" class="t p">→</text><text x="790" y="430" class="t p red">38℃</text>
  <text x="500" y="465" class="t small muted">最低温</text><text x="600" y="465" class="t p">22℃</text><text x="695" y="465" class="t p">→</text><text x="790" y="465" class="t p red">28℃</text>
  <text x="500" y="500" class="t small muted">降水</text><text x="600" y="500" class="t p">12mm</text><text x="695" y="500" class="t p">→</text><text x="790" y="500" class="t p">0mm</text>

  <rect x="925" y="280" rx="18" width="430" height="250" class="card"/>
  <text x="950" y="318" class="t h2">③ 小时候的夏天真的更凉吗？</text>
  <text x="950" y="343" class="t small muted">按年代比较长期气候，不靠模糊体感</text>
  <text x="950" y="390" class="t p">1990s</text><rect x="1030" y="376" width="170" height="18" rx="9" fill="#8fcdf0"/><text x="1210" y="390" class="t small">31.4℃</text>
  <text x="950" y="427" class="t p">2000s</text><rect x="1030" y="413" width="195" height="18" rx="9" fill="#68b7e5"/><text x="1235" y="427" class="t small">32.1℃</text>
  <text x="950" y="464" class="t p">2010s</text><rect x="1030" y="450" width="220" height="18" rx="9" fill="#3f9ed6"/><text x="1260" y="464" class="t small">32.8℃</text>
  <text x="950" y="501" class="t p">2020s</text><rect x="1030" y="487" width="250" height="18" rx="9" fill="#e95f52"/><text x="1290" y="501" class="t small">33.5℃</text>

  <!-- row 2 -->
  <rect x="45" y="555" rx="18" width="400" height="280" class="card"/>
  <text x="70" y="593" class="t h2">④ 这个月是不是特别离谱？</text>
  <text x="70" y="618" class="t small muted">从单日扩展到整月 / 整季节的历史排名</text>
  <rect x="75" y="648" rx="12" width="340" height="42" fill="#fff4ec"/>
  <text x="92" y="675" class="t small red">高温天数 21 天 · 历史 Top 5%</text>
  <rect x="75" y="700" rx="12" width="340" height="42" fill="#f0f8ff"/>
  <text x="92" y="727" class="t small blue">平均最高温 35.1℃ · 历史 Top 3%</text>
  <rect x="75" y="752" rx="12" width="340" height="42" fill="#eef9f5"/>
  <text x="92" y="779" class="t small green">累计降水 42mm · 历史 Bottom 20%</text>
  <text x="75" y="816" class="t small muted">🔥 热得明显 · 🌧️ 雨偏少 · 🌙 夜间尤其偏热</text>

  <rect x="470" y="555" rx="18" width="430" height="280" class="card"/>
  <text x="495" y="593" class="t h2">⑤ 城市气候档案 / 城市 PK</text>
  <text x="495" y="618" class="t small muted">看一座城市几十年的变化，也能横向比较</text>
  <text x="520" y="660" class="t h3 blue">南昌</text><text x="745" y="660" class="t h3 green">武汉</text>
  <text x="500" y="700" class="t small muted">高温日</text><rect x="575" y="688" width="105" height="14" rx="7" fill="#e95f52"/><rect x="790" y="688" width="125" height="14" rx="7" fill="#f08a76"/>
  <text x="500" y="735" class="t small muted">热夜</text><rect x="575" y="723" width="90" height="14" rx="7" fill="#e95f52"/><rect x="790" y="723" width="118" height="14" rx="7" fill="#f08a76"/>
  <text x="500" y="770" class="t small muted">年降水</text><rect x="575" y="758" width="120" height="14" rx="7" fill="#48a9dc"/><rect x="790" y="758" width="100" height="14" rx="7" fill="#72bde5"/>
  <text x="500" y="810" class="t small blue">→ 不是比“最高温”，而是比长期气候特征</text>

  <rect x="925" y="555" rx="18" width="430" height="280" class="card"/>
  <text x="950" y="593" class="t h2">⑥ AI 气象解说员 + Agent API</text>
  <text x="950" y="618" class="t small muted">Spark 算百分位和趋势，AI 只解释统计结果</text>
  <rect x="950" y="645" rx="14" width="380" height="105" fill="#f7f9fb" stroke="#e3e8ed"/>
  <text x="970" y="672" class="t small">“今天最高温处于历史同期约第 98 百分位，</text>
  <text x="970" y="697" class="t small">明显偏热，但没有突破历史极值；</text>
  <text x="970" y="722" class="t small">更突出的异常是夜间最低温同样偏高。”</text>
  <rect x="950" y="770" rx="10" width="380" height="42" fill="#eef8f4"/>
  <text x="970" y="796" class="t small green">🤖 GET /api/climate/rank · 可被个人 Agent 调用</text>

  <text x="55" y="885" class="t h3">一句话看懂：</text>
  <text x="170" y="885" class="t h3 blue">把“今天 38℃”变成“它在过去几十年里到底有多罕见”。</text>
</svg>